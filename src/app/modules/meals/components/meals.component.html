<section class="meals-page" aria-labelledby="meals-title">
  <app-bebel-hero
    variant="meals"
    eyebrow="Blog da Bebel"
    title="Receitas da Bebel"
    titleId="meals-title"
    subtitle="Escolha por categoria. Cada receita tem ingredientes, porções, modo de preparo e uma lista para marcar o que você já tem."
    speech="Bora pra cozinha? 💜"
  ></app-bebel-hero>

  @if (recipeGroups.length) {
    <section class="canal-section" aria-labelledby="recipes-title">
      @for (group of recipeGroups; track group.id) {
        <section class="recipe-group" [attr.aria-labelledby]="'category-' + group.id">
          <h3 class="recipe-group__title" [id]="'category-' + group.id">{{ group.label }}</h3>
          <div class="recipe-grid">
            @for (recipe of group.recipes; track recipe.id) {
              <a class="recipe-card" [routerLink]="recipePath(recipe.slug)">
                <span class="recipe-card__thumb"
                  ><img
                    [src]="recipe.image.src"
                    [alt]="recipe.image.alt"
                    width="1280"
                    height="720"
                    loading="lazy"
                /></span>
                <strong class="recipe-card__title">{{ recipe.title }}</strong>
              </a>
            }
          </div>
        </section>
      }
    </section>
  }
</section>
