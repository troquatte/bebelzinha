<section class="home" aria-labelledby="home-title">
  <app-bebel-hero
    variant="home"
    sticker="A Bebel sabe das coisas ✦"
    kicker="Ô, minha filha..."
    title="Deixa a Bebel facilitar sua vida de casa."
    titleId="home-title"
    speech="Chega mais 💜"
  ></app-bebel-hero>

  <section class="quick-actions" aria-labelledby="quick-actions-title">
    <div class="section-heading">
      <div>
        <span class="section-heading__eyebrow">Pra resolver agora</span>
        <h2 id="quick-actions-title">O que você quer resolver?</h2>
      </div>
    </div>

    <div class="quick-actions__grid">
      <button type="button" class="quick-action" (click)="goShopping()">
        <span class="quick-action__icon material-symbols-outlined" aria-hidden="true"
          >shopping_cart</span
        >
        <span>
          <h3>Vou ao mercado</h3>
          <p>Abre sua lista ou começa uma nova.</p>
        </span>
      </button>

      <button type="button" class="quick-action" (click)="chooseMeal()">
        <span class="quick-action__icon material-symbols-outlined" aria-hidden="true">skillet</span>
        <span>
          <h3>Não sei o que cozinhar</h3>
          <p>A Bebel te ajuda a escolher.</p>
        </span>
      </button>
    </div>
  </section>

  <aside class="bebel-note bebel-note-card">
    <span class="bebel-note-card__icon" aria-hidden="true">💡</span>
    <div class="bebel-note-card__content">
      <strong>Dica da Bebel</strong>
      <p>Organização boa é a que tira peso da cabeça, não a que inventa mais regra.</p>
    </div>
  </aside>
</section>
