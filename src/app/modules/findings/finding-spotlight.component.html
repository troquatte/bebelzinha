@if (finding(); as item) {
  <aside class="finding-spotlight" aria-label="Achadinho contextual da Bebel">
    <a
      class="finding-spotlight__image"
      [routerLink]="['/achadinhos', item.slug]"
      (click)="trackClick()"
      [attr.aria-label]="'Ver detalhes de ' + item.title"
    >
      <img [src]="item.image" [alt]="item.title" />
    </a>

    <div class="finding-spotlight__copy">
      <span class="finding-spotlight__eyebrow">{{ copy().eyebrow }}</span>
      <h3>{{ item.title }}</h3>
      <p class="finding-spotlight__context">{{ copy().contextText }}</p>
      <p>{{ item.bebelNote }}</p>

      @if (item.isAffiliate) {
        <small class="finding-spotlight__affiliate">Produto com link de afiliado</small>
      }

      <a
        class="finding-spotlight__link"
        [routerLink]="['/achadinhos', item.slug]"
        (click)="trackClick()"
      >
        Ver achadinho
      </a>
    </div>
  </aside>
}
