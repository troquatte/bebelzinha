<div class="app-shell">
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/" aria-label="Bebel - início">
      <span class="brand__mark" aria-hidden="true">B</span>
      <span class="brand__text">
        <strong>Bebel</strong>
        <small>A Bebel sabe das coisas</small>
      </span>
    </a>

    <p class="sidebar__eyebrow">Seu cantinho</p>

    <nav class="sidebar__nav" aria-label="Seções da Bebel">
      <a class="nav-item nav-item--active" routerLink="/" aria-current="page">
        <span class="nav-item__icon" aria-hidden="true">⌂</span>
        <span>Início</span>
      </a>

      <span class="nav-item nav-item--disabled" aria-disabled="true">
        <span class="nav-item__icon" aria-hidden="true">✓</span>
        <span>Casa</span>
        <small>Em breve</small>
      </span>

      <span class="nav-item nav-item--disabled" aria-disabled="true">
        <span class="nav-item__icon" aria-hidden="true">♡</span>
        <span>Comidinhas</span>
        <small>Em breve</small>
      </span>

      <span class="nav-item nav-item--disabled" aria-disabled="true">
        <span class="nav-item__icon" aria-hidden="true">☷</span>
        <span>Compras</span>
        <small>Em breve</small>
      </span>

      <span class="nav-item nav-item--disabled" aria-disabled="true">
        <span class="nav-item__icon" aria-hidden="true">✦</span>
        <span>Achadinhos</span>
        <small>Em breve</small>
      </span>
    </nav>

    <aside class="sidebar__note">
      <span class="sidebar__note-label">Bebel diz</span>
      <p>Casa organizada é casa que funciona pra você — não o contrário.</p>
    </aside>
  </aside>

  <main class="app-content" id="conteudo-principal">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a class="bottom-nav__item bottom-nav__item--active" routerLink="/" aria-current="page">
      <span class="bottom-nav__icon" aria-hidden="true">⌂</span>
      <span>Início</span>
    </a>

    <span class="bottom-nav__item bottom-nav__item--disabled" aria-disabled="true" aria-label="Casa, em breve">
      <span class="bottom-nav__icon" aria-hidden="true">✓</span>
      <span>Casa</span>

    <span class="bottom-nav__item bottom-nav__item--disabled" aria-disabled="true" aria-label="Comidinhas, em breve">
      <span class="bottom-nav__icon" aria-hidden="true">♡</span>
      <span>Comidinhas</span>
    </span>

    <span class="bottom-nav__item bottom-nav__item--disabled" aria-disabled="true" aria-label="Compras, em breve">
      <span class="bottom-nav__icon" aria-hidden="true">☷</span>
      <span>Compras</span>
    </span>

    <span class="bottom-nav__item bottom-nav__item--disabled" aria-disabled="true" aria-label="Achadinhos, em breve">
      <span class="bottom-nav__icon" aria-hidden="true">✦</span>
      <span>Achados</span>
    </span>
