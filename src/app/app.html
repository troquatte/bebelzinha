<app-onboarding />

<div class="app-shell">
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/" aria-label="Bebel - início">
      <span class="brand__mark" aria-hidden="true">B</span>
      <span class="brand__text">
        <strong>Bebel</strong>
        <small>A Bebel sabe das coisas</small>
      </span>
    </a>

    <span class="sidebar__eyebrow">Seu cantinho</span>

    <nav class="sidebar__nav" aria-label="Seções da Bebel">
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-item__icon" aria-hidden="true">⌂</span>
        <span>Início</span>
      </a>

      <a
        class="nav-item"
        routerLink="/comidinhas"
        routerLinkActive="nav-item--active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-item__icon" aria-hidden="true">♡</span>
        <span>Comidinhas</span>
      </a>

      <a
        class="nav-item"
        routerLink="/compras"
        routerLinkActive="nav-item--active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-item__icon" aria-hidden="true">☷</span>
        <span>Lista de compras</span>
      </a>

      <span class="nav-item nav-item--disabled" aria-disabled="true">
        <span class="nav-item__icon" aria-hidden="true">✦</span>
        <span>Achadinhos</span>
        <small>Em breve</small>
      </span>
    </nav>

    <aside class="sidebar__note">
      <span class="sidebar__note-label">Bebel diz</span>
      <p>Ô, minha filha… casa boa é a que facilita sua vida, não a que dá mais trabalho.</p>
    </aside>
  </aside>

  <main class="app-content" id="conteudo-principal">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a
      class="bottom-nav__item"
      routerLink="/"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <span class="bottom-nav__icon" aria-hidden="true">⌂</span>
      <span>Início</span>
    </a>

    <a
      class="bottom-nav__item"
      routerLink="/comidinhas"
      routerLinkActive="bottom-nav__item--active"
      ariaCurrentWhenActive="page"
    >
      <span class="bottom-nav__icon" aria-hidden="true">♡</span>
      <span>Comidinhas</span>
    </a>

    <a
      class="bottom-nav__item"
      routerLink="/compras"
      routerLinkActive="bottom-nav__item--active"
      ariaCurrentWhenActive="page"
    >
      <span class="bottom-nav__icon" aria-hidden="true">☷</span>
      <span class="bottom-nav__label">Lista de<br />compras</span>
    </a>

    <span class="bottom-nav__item bottom-nav__item--disabled" aria-disabled="true" aria-label="Achadinhos, em breve">
      <span class="bottom-nav__icon" aria-hidden="true">✦</span>
      <span>Achados</span>
    </span>
  </nav>
</div>
